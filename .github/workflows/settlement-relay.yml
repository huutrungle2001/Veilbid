name: Settlement relay

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: veilbid-settlement-relay
  cancel-in-progress: false

jobs:
  settle:
    name: Process eligible Sepolia tenders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      FINALIZER_PRIVATE_KEY: ${{ secrets.FINALIZER_PRIVATE_KEY }}
      FINALIZER_ACTION_BUDGET: "5"
      FINALIZER_PROOF_ATTEMPTS: "3"
      FINALIZER_PROOF_DELAY_MS: "5000"
      VEILBID_ALLOW_UNVERIFIED_DEPLOYMENT: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run one stateless relay cycle
        run: pnpm finalizer:once
